<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Life · Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Geist",ui-sans-serif,system-ui,sans-serif;background:#0A0C11;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;background:none;border:0;padding:0;color:inherit}
input,textarea,select{font:inherit}
select{appearance:none;-webkit-appearance:none;cursor:pointer}
input::placeholder{color:inherit;opacity:.8}
input:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-thumb{background-color:var(--sb-thumb,rgba(128,128,128,.4));border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:40px}::-webkit-scrollbar-thumb:hover{background-color:var(--sb-hover,rgba(128,128,128,.7))}::-webkit-scrollbar-thumb:active{background-color:var(--sb-active,rgba(128,128,128,.9))}::-webkit-scrollbar-button{display:none;width:0;height:0}
</style>
</helmet>

<div style="--sb-thumb: {{t.faint}}; --sb-hover: {{t.muted}}; --sb-active: {{t.accent}}; width: 1440px; height: 1000px; position: relative; overflow: hidden; background: {{t.bg}}; font-family: Geist, ui-sans-serif, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
<dc-import name="Main" theme="{{themeKey}}" hint-size="1440px,1320px"></dc-import>
</div>
<a href="Main.dc.html" aria-label="Close settings" style="position: absolute; inset: 0; background: {{t.scrim}}; backdrop-filter: blur(6px)"></a>

<div role="dialog" aria-modal="true" aria-labelledby="pl-set-title" style="position: absolute; left: 160px; top: 50px; width: 1120px; height: 900px; display: flex; border-radius: 28px; background: {{t.bg}}; color: {{t.text}}; border: 1px solid {{t.line}}; box-shadow: 0 40px 120px rgba(0,0,0,0.55); overflow: hidden">

<nav aria-label="Settings sections" style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px 14px 16px; background: {{t.side}}; border-right: 1px solid {{t.line}}">
<h2 id="pl-set-title" style="margin: 0; padding: 0 10px; font-family: 'Atkinson Hyperlegible', Geist, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Settings</h2>
<label for="pl-set-find" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: {{t.panel}}; border: 1px solid {{t.line}}; color: {{t.muted}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="pl-set-find" value="{{query}}" onChange="{{onQuery}}" placeholder="Search settings" aria-label="Search settings" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: {{t.text}}; font-size: 13px">
</label>
<div class="pl-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{navGroups}}" as="ng" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; color: {{t.muted}}">{{ng.label}}</span>
<sc-for list="{{ng.items}}" as="it" hint-placeholder-count="4">
<button onClick="{{it.pick}}" aria-current="{{it.cur}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 11px; font-size: 14px; font-weight: 500; text-align: left; background: {{it.bg}}; color: {{it.fg}}">
<span style="display: flex; color: {{it.ic_color}}"><sc-if value="{{it.ic.profile}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></sc-if><sc-if value="{{it.ic.general}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></sc-if><sc-if value="{{it.ic.appearance}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17"></path><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"></path></svg></sc-if><sc-if value="{{it.ic.home}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></sc-if><sc-if value="{{it.ic.notifications}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></sc-if><sc-if value="{{it.ic.shortcuts}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"></path></svg></sc-if><sc-if value="{{it.ic.accessibility}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><path d="M5 9l7 1.5L19 9M12 10.5V15l-3 5M12 15l3 5"></path></svg></sc-if><sc-if value="{{it.ic.notes}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h7M9 17h5"></path></svg></sc-if><sc-if value="{{it.ic.schedule}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></sc-if><sc-if value="{{it.ic.tasks}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg></sc-if><sc-if value="{{it.ic.habits}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg></sc-if><sc-if value="{{it.ic.accounts}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></sc-if><sc-if value="{{it.ic.storage}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path></svg></sc-if><sc-if value="{{it.ic.privacy}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg></sc-if><sc-if value="{{it.ic.about}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg></sc-if></span>
<span style="flex-grow: 1">{{it.label}}</span>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 7px; border-radius: 999px; display: flex; align-items: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; background: {{t.accentSoft}}; color: {{t.accent}}">{{it.badge}}</span></sc-if>
</button>
</sc-for>
</div>
</sc-for>
<sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}"><span style="padding: 0 12px; font-size: 13px; color: {{t.muted}}">No settings match that.</span></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; border-top: 1px solid {{t.line}}; font-size: 12px; color: {{t.muted}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.accent2}}"></span>Changes save as you go</div>
</nav>

<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 20px 18px 32px; border-bottom: 1px solid {{t.line}}">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; border-radius: 13px; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{cur.ic.profile}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></sc-if><sc-if value="{{cur.ic.general}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></sc-if><sc-if value="{{cur.ic.appearance}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17"></path><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"></path></svg></sc-if><sc-if value="{{cur.ic.home}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></sc-if><sc-if value="{{cur.ic.notifications}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></sc-if><sc-if value="{{cur.ic.shortcuts}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"></path></svg></sc-if><sc-if value="{{cur.ic.accessibility}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><path d="M5 9l7 1.5L19 9M12 10.5V15l-3 5M12 15l3 5"></path></svg></sc-if><sc-if value="{{cur.ic.notes}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h7M9 17h5"></path></svg></sc-if><sc-if value="{{cur.ic.schedule}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></sc-if><sc-if value="{{cur.ic.tasks}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg></sc-if><sc-if value="{{cur.ic.habits}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg></sc-if><sc-if value="{{cur.ic.accounts}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></sc-if><sc-if value="{{cur.ic.storage}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path></svg></sc-if><sc-if value="{{cur.ic.privacy}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg></sc-if><sc-if value="{{cur.ic.about}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg></sc-if></span>
<div style="display: flex; flex-direction: column; gap: 3px">
<h3 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">{{cur.label}}</h3>
<span style="font-size: 13px; color: {{t.muted}}">{{cur.desc}}</span>
</div>
</div>
<a href="Main.dc.html" aria-label="Close settings" title="Close (Esc)" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; border: 1px solid {{t.line}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>

<div class="pl-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 22px">

<sc-if value="{{isAppearance}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: {{t.muted}}">THEME</span>
<div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="4">
<button role="radio" aria-checked="{{th.on}}" onClick="{{th.pick}}" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 12px; border-radius: 18px; text-align: left; background: {{t.panel}}; border: 2px solid {{th.ring}}">
<span style="display: flex; height: 96px; border-radius: 12px; overflow: hidden; background: {{th.bg}}; border: 1px solid {{th.line}}">
<span style="width: 22px; background: {{th.side}}; border-right: 1px solid {{th.line}}; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{th.accent}}"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: {{th.muted}}; opacity: 0.6"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: {{th.muted}}; opacity: 0.6"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 9px"><span style="width: 60%; height: 7px; border-radius: 3px; background: {{th.text}}"></span><span style="display: flex; gap: 5px; flex-grow: 1"><span style="flex-grow: 2; border-radius: 6px; background: {{th.panel}}; display: flex; align-items: flex-end; padding: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: {{th.accent}}"></span></span><span style="flex-grow: 1; border-radius: 6px; background: {{th.panel}}; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 50%; border: 3px solid {{th.accent2}}"></span></span></span></span>
</span>
<span style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px"><span style="font-size: 14px; font-weight: 600">{{th.name}}</span><sc-if value="{{th.sel}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.accent}}; color: {{t.accentInk}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8-9"></path></svg></span></sc-if></span>
<span style="padding: 0 4px; font-size: 11px; color: {{t.muted}}">{{th.mood}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-for list="{{blocks}}" as="bl" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{bl.hasTitle}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: {{t.muted}}">{{bl.title}}</span></sc-if>
<div style="display: flex; flex-direction: column; border-radius: 16px; border: 1px solid {{t.line}}; background: {{t.panel}}; overflow: hidden">
<sc-for list="{{bl.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 10px 14px 10px 18px; border-bottom: 1px solid {{r.divider}}">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500; color: {{r.labelFg}}">{{r.label}}</span>
<sc-if value="{{r.hasDesc}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: {{t.muted}}; line-height: 1.45">{{r.desc}}</span></sc-if>
</div>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}"><button onClick="{{r.toggle}}" role="switch" aria-checked="{{r.onStr}}" aria-label="{{r.label}}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 24px; border-radius: 999px; padding: 3px; background: {{r.swBg}}; display: flex; justify-content: {{r.swJust}}"><span style="width: 18px; height: 18px; border-radius: 50%; background: {{r.swKnob}}"></span></span></button></sc-if>
<sc-if value="{{r.isSeg}}" hint-placeholder-val="{{false}}"><div role="radiogroup" aria-label="{{r.label}}" style="display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: {{t.panel2}}; flex-shrink: 0"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 500; background: {{o.bg}}; color: {{o.fg}}; white-space: nowrap">{{o.label}}</button></sc-for></div></sc-if>

  renderVals() {
    const P = this.palette();
    const s = this.state || {};
    const key = s.theme || this.props.theme || 'midnight';
    const t = P[key] || P.midnight;
    const vals = s.vals || {};
    const q = (s.query || '').trim().toLowerCase();
    const secs = this.sections();
    const curId = s.sec || 'appearance';
    const ICONS = ['profile', 'general', 'appearance', 'home', 'notifications', 'shortcuts', 'accessibility', 'notes', 'schedule', 'tasks', 'habits', 'accounts', 'storage', 'privacy', 'about'];
    const ic = (id) => { const o = {}; ICONS.forEach((k) => { o[k] = k === id; }); return o; };
    const setVal = (id, v) => this.setState({ vals: { ...vals, [id]: v } });
    const get = (id, d) => (vals[id] !== undefined ? vals[id] : d);
    const matches = (it) => !q || it.label.toLowerCase().includes(q) || it.blocks.some((b) => b.rows.some((r) => String(r[r[0] === 'B' || r[0] === 'I' || r[0] === 'P' || r[0] === 'K' ? 1 : 2]).toLowerCase().includes(q)));

    let all = [];
    const navGroups = secs.map((g) => ({
      label: g.group,
      items: g.items.filter(matches).map((it) => {
        all.push(it);
        const on = it.id === curId;
        return { label: it.label, ic: ic(it.id), cur: on ? 'page' : 'false', bg: on ? t.panel : 'transparent', fg: on ? t.text : t.muted, ic_color: on ? t.accent : t.muted,
          hasBadge: !!it.badge, badge: it.badge || '', pick: () => this.setState({ sec: it.id }) };
      })
    })).filter((g) => g.items.length);
    const flat = [];
    secs.forEach((g) => g.items.forEach((it) => flat.push(it)));
    const cur = flat.find((x) => x.id === curId) || flat[0];

    const sw = (on) => ({ swBg: on ? t.accent : t.panel2, swJust: on ? 'flex-end' : 'flex-start', swKnob: on ? t.accentInk : t.muted });
    const blank = { isToggle: false, isSeg: false, isSelect: false, isButton: false, isInfo: false, isPath: false, isKeys: false, isSwatches: false, isAccount: false, hasDesc: false, labelFg: t.text };

    const blocks = cur.blocks.map((b) => ({
      title: b.title, hasTitle: !!b.title,
      rows: b.rows.map((r, idx) => {
        const last = idx === b.rows.length - 1;
        const base = { ...blank, divider: last ? 'transparent' : t.line };
        const type = r[0];
        if (type === 'T') { const on = get(r[1], r[4]); return { ...base, isToggle: true, label: r[2], desc: r[3], hasDesc: !!r[3], onStr: String(on), toggle: () => setVal(r[1], !on), ...sw(on) }; }
        if (type === 'S') { const v = get(r[1], r[5]); return { ...base, isSeg: true, label: r[2], desc: r[3], hasDesc: !!r[3], opts: r[4].map((o, i) => ({ label: o, on: String(i === v), bg: i === v ? t.panel : 'transparent', fg: i === v ? t.text : t.muted, pick: () => setVal(r[1], i) })) }; }
        if (type === 'L') { const v = get(r[1], r[5]); return { ...base, isSelect: true, label: r[2], desc: r[3], hasDesc: !!r[3], value: r[4][v], selAria: r[2] + ': ' + r[4][v], cycle: () => setVal(r[1], (v + 1) % r[4].length) }; }
        if (type === 'B') {
          const tone = r[4];
          return { ...base, isButton: true, label: r[1], desc: r[2], hasDesc: !!r[2], action: r[3], labelFg: tone === 'danger' ? t.danger : t.text,
            btnBg: tone === 'primary' ? t.accent : 'transparent', btnFg: tone === 'primary' ? t.accentInk : (tone === 'danger' ? t.danger : t.text), btnBd: tone === 'primary' ? t.accent : (tone === 'danger' ? t.danger : t.line) };
        }
        if (type === 'I') return { ...base, isInfo: !!r[3], label: r[1], desc: r[2], hasDesc: !!r[2], value: r[3] };
        if (type === 'P') return { ...base, isPath: true, label: r[1], desc: r[2], hasDesc: !!r[2], value: r[3] };
        if (type === 'K') return { ...base, isKeys: true, label: r[1], keys: r[2].map((k) => ({ k: k })) };

            toggle: () => setVal(r[1], !on) };
        }
        return base;
      })

      ...P[k], on: String(k === key), sel: k === key, ring: k === key ? t.accent : 'transparent',
